<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Ladder — Fire TV Dashboard · Design Canvas</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #161411;
    --bg-subtle: #1c1915;
    --surface: #221f1a;
    --surface-raised: #2a2620;
    --border: rgba(239,234,226,0.07);
    --border-hover: rgba(239,234,226,0.14);
    --accent: #d9a05b;
    --accent-dim: rgba(217,160,91,0.15);
    --sage: #a8b5a0;
    --text: #efeae2;
    --text-secondary: rgba(239,234,226,0.62);
    --text-tertiary: rgba(239,234,226,0.34);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --font-sans: "Instrument Sans", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
    --note-bg: #2a241c;
    --note-border: rgba(217,160,91,0.22);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitchTiles'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  .canvas-viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; --grid-color: rgba(239,234,226,0.045); }
  .canvas-viewport.panning { cursor: grabbing; }
  .canvas-world { position: absolute; left: 0; top: 0; width: 20000px; height: 20000px; transform-origin: 0 0; will-change: transform; }

  .canvas-el { position: absolute; cursor: grab; transition: box-shadow var(--transition-normal), transform var(--transition-fast); }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging { cursor: grabbing; z-index: 999; box-shadow: var(--shadow-drag) !important; transform: scale(1.01); transition: none; }

  .section-header { position: absolute; pointer-events: none; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .section-header .section-num { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--accent); opacity: 0.85; }
  .section-header .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); }
  .section-header .section-line { flex: none; width: 48px; height: 1px; background: linear-gradient(90deg, var(--accent) 0%, transparent 100%); opacity: 0.35; }

  .canvas-title { position: absolute; pointer-events: none; font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; color: var(--text); }
  .canvas-text { position: absolute; line-height: 1.7; letter-spacing: 0.005em; color: var(--text-secondary); min-width: 200px; max-width: 560px; white-space: pre-wrap; word-break: break-word; }

  .canvas-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 100px; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); transition: border-color var(--transition-fast), background var(--transition-fast); white-space: nowrap; }
  .canvas-tag:hover { border-color: var(--border-hover); background: var(--surface-raised); }
  .canvas-tag .tag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .context-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; min-width: 220px; transition: border-color var(--transition-normal), box-shadow var(--transition-normal); }
  .context-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .context-card .card-head { padding: 16px 20px 12px; display: flex; align-items: center; gap: 10px; }
  .context-card .card-head .head-indicator { width: 3px; height: 16px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .context-card .card-head h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--text); }
  .context-card .card-content { padding: 0 20px 20px; font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
  .context-card .card-content ul { list-style: none; padding: 0; }
  .context-card .card-content li { padding: 4px 0 4px 12px; position: relative; }
  .context-card .card-content li::before { content: ''; position: absolute; left: 0; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-tertiary); }

  .ds-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; transition: border-color var(--transition-normal), box-shadow var(--transition-normal); }
  .ds-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .ds-card .ds-head { padding: 16px 20px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); }
  .ds-card .ds-body { padding: 0 20px 20px; }

  .canvas-note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: var(--radius-md); padding: 16px 18px; min-width: 200px; max-width: 300px; box-shadow: var(--shadow-sm); }
  .canvas-note .note-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); opacity: 0.75; margin-bottom: 8px; }
  .canvas-note .note-body { font-size: 13px; line-height: 1.65; color: var(--text-secondary); }

  .design-page { background: #24221e; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-lg); }
  .page-label { position: absolute; bottom: -32px; left: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: var(--text-tertiary); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .page-label .label-num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); opacity: 0.7; }

  .canvas-diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .canvas-diagram .diagram-content { width: 100%; height: 100%; padding: 20px; }

  .zoom-controls { position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 1px; z-index: 100; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
  .zoom-btn { width: 36px; height: 36px; background: transparent; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--transition-fast), color var(--transition-fast); }
  .zoom-btn:hover { background: rgba(239,234,226,0.06); color: var(--text); }
  .zoom-label { min-width: 50px; height: 36px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

  .coord-indicator { position: fixed; bottom: 28px; left: 24px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-tertiary); z-index: 100; padding: 4px 10px; background: rgba(22,20,17,0.85); border: 1px solid var(--border); border-radius: var(--radius-sm); }
</style>
<!--
  Discovery (audit trail):
    deliverable: Infinite canvas design file — Care Ladder Fire TV caregiver dashboard (App-class, 2-of-2)
    audience: Anoop + Build/Ship/Shape hackathon judges; emotion target = calm trust
    direction: Calm Care-Tech (locked via user selection 2026-09-26)
      empathy + audit-grade clarity + anti-voyeurism (no live video; silhouettes only; on-device framing)
    sections: Row1 context / Row2 design system / Row3 five screens (All clear → Check-in → Escalation → Timeline → Care plan)
    tokens: bg #24221E · surface #2E2B25 · sage #A8B5A0 · amber #D9A05B · cream #EFEAE2 · clay #D98873 · slate #9DB0C7
    type: Instrument Sans (display+body) + JetBrains Mono (audit data) — Inter/Space Grotesk avoided per anti-slop craft
-->
<body>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
  <button class="zoom-btn" id="zoomReset" title="Reset view" aria-label="Reset view">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>

<script>
(() => {
  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  let isPanning = false, panSX, panSY;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true; panSX = e.clientX - panX; panSY = e.clientY - panY;
      viewport.classList.add('panning'); viewport.setPointerCapture(e.pointerId); e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) { panX = e.clientX - panSX; panY = e.clientY - panSY; updateTransform(); }
  });
  viewport.addEventListener('pointerup', () => { isPanning = false; viewport.classList.remove('panning'); });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom; panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) { panX -= e.deltaX; panY -= e.deltaY; }
      else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom; panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom; panY = cy - wy * zoom;
    updateTransform();
  }
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 0.9; panX = 40; panY = 20; updateTransform(); };

  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  let lastPinchDist = null, lastPinchCenter = null;
  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });
  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom; panY = my - wy * zoom;
    }
    if (lastPinchCenter) { panX += center.x - lastPinchCenter.x; panY += center.y - lastPinchCenter.y; }
    lastPinchDist = dist; lastPinchCenter = center;
    updateTransform();
  }, { passive: false });
  viewport.addEventListener('touchend', (e) => { if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; } });

  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => s.push({ id: el.id, left: el.style.left, top: el.style.top }));
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => { const el = document.getElementById(a.id); if (el) { el.style.left = a.left; el.style.top = a.top; } });
    updateTransform();
  }
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); } });

  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      dragging = true; el.classList.add('dragging'); saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId); e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
    });
    el.addEventListener('pointerup', () => { if (dragging) { dragging = false; el.classList.remove('dragging'); } });
  }

  let _id = 0;
  function uid(prefix) { return (prefix || 'el') + '-' + (++_id); }

  function addSection(rowY, label) {
    const parts = label.split(' ');
    const num = parts[0] || '';
    const rest = parts.slice(1).join(' ');
    const el = document.createElement('div');
    el.className = 'section-header';
    el.style.left = '60px'; el.style.top = rowY + 'px';
    el.innerHTML = `<span class="section-line"></span><span class="section-num">${num}</span><span class="section-label">${rest}</span>`;
    world.appendChild(el);
    return rowY;
  }
  function addTitle(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-title'; el.id = uid('title');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 48) + 'px';
    if (options.fontWeight) el.style.fontWeight = options.fontWeight;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el); return el;
  }
  function addText(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-text canvas-el'; el.id = uid('text');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 14) + 'px';
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el); makeDraggable(el); return el;
  }
  function addTag(x, y, label, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('tag');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    const dotColor = options.color || 'var(--accent)';
    el.innerHTML = `<div class="canvas-tag"><span class="tag-dot" style="background:${dotColor}"></span>${label}</div>`;
    world.appendChild(el); makeDraggable(el); return el;
  }
  function addContextCard(x, y, w, h, title, content) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('ctx');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';
    el.innerHTML = `<div class="context-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="card-head"><div class="head-indicator"></div><h3>${title}</h3></div>
      <div class="card-content">${content}</div></div>`;
    world.appendChild(el); makeDraggable(el); return el;
  }
  function addDesignSystemCard(x, y, w, h, type, data) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('ds');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';
    let body = data.html || '';
    el.innerHTML = `<div class="ds-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="ds-head">${data.title || type}</div><div class="ds-body">${body}</div></div>`;
    world.appendChild(el); makeDraggable(el); return el;
  }
  function addNote(x, y, tag, text) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('note');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = `<div class="canvas-note"><div class="note-tag">${tag}</div><div class="note-body">${text}</div></div>`;
    world.appendChild(el); makeDraggable(el); return el;
  }
  function addDiagram(x, y, w, h, htmlContent) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('diagram');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
    el.innerHTML = `<div class="canvas-diagram" style="width:100%;height:100%;"><div class="diagram-content">${htmlContent}</div></div>`;
    world.appendChild(el); makeDraggable(el); return el;
  }
  let _pageNum = 0;
  function addPage(x, y, w, h, label, htmlContent) {
    _pageNum++;
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('page');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = (h + 40) + 'px';
    el.innerHTML = `<div class="design-page" style="width:${w}px;height:${h}px;"><div style="width:100%;height:100%;overflow:hidden;">${htmlContent}</div></div>
    <div class="page-label"><span class="label-num">${String(_pageNum).padStart(2,'0')}</span>${label}</div>`;
    world.appendChild(el); makeDraggable(el); return el;
  }

  function below(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.top) + el.offsetHeight + gap; }
  function rightOf(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.left) + el.offsetWidth + gap; }
  function maxY(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.top) + e.offsetHeight)) + gap; }

  /* ═══════════ CARE LADDER CANVAS SCENE ═══════════ */
  function buildScene() {

    /* ── Row 1 · PROJECT CONTEXT ── */
    addSection(40, '01 · PROJECT CONTEXT');

    const r1Title = addTitle(100, 96, 'Care Ladder · Fire TV Caregiver Dashboard', { fontSize: 46, fontWeight: 700, maxWidth: 900 });
    const r1Desc = addText(100, below(r1Title, 14),
      'The caretaker surface of Care Ladder — a 10-foot Fire TV dashboard for the Amazon Build, Ship, Shape hackathon (Alexa+ primary track).\nOpenCV notices something might be wrong. Alexa+ runs a multi-step voice check-in. The ladder confirms before it escalates.\nThis TV shows the caretaker what happened, which rung the agent is on, and what to do next — calm enough to live in a family living room.',
      { fontSize: 15, maxWidth: 640 });

    const tagsY = below(r1Desc, 18);
    const t1 = addTag(100, tagsY, 'Alexa+ primary', { color: '#d9a05b' });
    const t2 = addTag(rightOf(t1, 10), tagsY, 'OpenCV trigger', { color: '#a8b5a0' });
    const t3 = addTag(rightOf(t2, 10), tagsY, 'Fire TV surface', { color: '#d9a05b' });
    const t4 = addTag(rightOf(t3, 10), tagsY, '10-foot UI', { color: '#a8b5a0' });
