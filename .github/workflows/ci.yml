name: CI

on:
  push:
    branches: [main]
  pull_request:

# Test-only. Do not deploy — CloudFront https://d2u7pls4da2poz.cloudfront.net/
# is the shared opencv-care-ladder demo host and must stay stable for OpenCV judges.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -v
